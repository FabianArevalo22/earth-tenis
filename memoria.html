<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="assets/css/styleMemoria.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">
    <!--========== Favicon ==========-->
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
    <div class="conteiner">
        <div class="hud">
            <div class="topo">
                <div class="vazia"></div>
                <h1>Jogo da Memória</h1>
                <div class="btnTopo">
                    <div class="theme-btn">
                        <i class="ri-sun-fill sun-icon"></i>
                        <i class="ri-moon-fill moon-icon"></i>
                    </div>
                    <div class="return-btn"><a href="index.html"><i class="ri-arrow-right-line"></i></a></div>
                </div>
            </div>
            <div class="infoJogo">
                <div class="info-sub">
                    <div class="selecao">
                        <h3>Selecione a Dificuldade: </h3>
                        <div class="dropdown">
                            <h3 id="dificuldade">Médio <i class="ri-arrow-down-s-line"></i></h3>
                            <div id="opcoes" class="invisivel">
                                <h3 id="facil">Fácil</h3>
                                <h3 id="medio">Médio</h3>
                                <h3 id="dificil">Difícil</h3>
                            </div>
                        </div>
                    </div>
                    <h3 id="turnos">Turnos: </h3>
                </div>
                <div class="info-sub">
                    <h3 id="paresEncontrados">Pares encontrados: </h3>
                    <h3 id="paresRestantes">Pares restantes: </h3>
                </div>
                <h2 id="reiniciar">Reiniciar</h2>
            </div>
        </div>
        <div id="gradeCartas"></div>
    </div>
    <script src="assets/js/memoria.js"></script>
</body>
</html>
